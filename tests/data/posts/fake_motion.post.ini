# An invented post for the engine tests. The codes (Q0, ZZ ...) are not those of any real controller.
[post]
name = Fake motion
description = moves, comments, line numbers, modal codes
format_version = 1

[settings]
decimals = 2
line_number_prefix = L
line_number_start = 100
line_number_step = 5
comment_replace = ( -> <, ) -> >

[codes]
rapid = Q0
feed = Q1
ccw = Q2
cw = Q3
diameter_mode = Q7
radius_mode = Q8

[modal_groups]
motion = Q0 Q1 Q2 Q3

[header]
<text>%</text>
<text></text>
PROGRAM <project title>

[setup]
<x mode code> ZZ

[comment]
<text>;</text><comment text safe>

[rapid]
<code rapid changed> [X<X changed>] [Z<Z changed>]

[feed]
<N next> <code feed changed> X<X> Z<Z> [F<F changed>]

[arc_ccw]
<code ccw> X<X> Z<Z> I<I> K<K> [F<F changed>]

[arc_cw]
<code cw> X<X> Z<Z> R<R>
