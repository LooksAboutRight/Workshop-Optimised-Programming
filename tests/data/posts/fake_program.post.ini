# An invented post for the engine tests: what it knows about tools, blocks and the project.
[post]
name = Fake program
format_version = 1

[settings]
date_format = %Y/%m/%d
time_format = %H-%M

[codes]
tool = Q6

[modal_groups]
tool = Q6

[header]
FILE <project title> on <machine name> by <post name>
<date> <time> <date iso>
<tool count> tools, <block count> blocks, <path length decimals=1> mm, <estimated time> min
<list tools>
<list notes>

[tool_entry]
TOOL <tool number> <tool name>[ R<tool nose radius>]

[note_entry]
NOTE <note>

[block_start]
BLOCK <block number>/<block count> <block name>[ next <next block name>][ was <previous block name>]

[tool_change]
[T<next tool number> preload]
<code tool> T<tool number>[ O<tool offset>] from[ <previous tool number>] first <first tool number> last <last tool number>

[comment]
<comment text>
