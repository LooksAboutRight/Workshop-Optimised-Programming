# An invented post for the engine tests: spindle, coolant, stops, cycles.
[post]
name = Fake machine
format_version = 1

[settings]
decimals = 3
threading_style = two_block
drilling_style = cycle

[codes]
css = Q96
rpm = Q97
spindle_stop = Q5
coolant_flood = Q8
coolant_off = Q9

[modal_groups]
speed = Q96 Q97

[spindle_css]
<code css> [LIM<S max>] SPEED<S>

[spindle_rpm]
<code rpm> SPEED<S changed>

[spindle_stop]
<code spindle_stop>

[coolant_flood]
<code coolant_flood>

[coolant_mist]
<code coolant_flood> MIST

[coolant_off]
<code coolant_off>

[program_stop]
<text>PSTOP</text>

[optional_stop]
<text>OSTOP</text>

[dwell]
<text>WAIT </text><dwell>

[comment]
<comment text>

[thread_cycle]
<text>CYCLE P</text><pitch> Z<thread end Z>

[thread_two_block]
<text>T1 P</text><spring passes width=2><text>00</text><compound angle decimals=0 width=2>
<text>T2 X</text><thread root X> Z<thread end Z> P<thread depth scale=1000 decimals=0> Q<first cut scale=1000 decimals=0>[ E<taper distance> L<taper code>]

[thread_passes]
<text>PASSES</text>

[feed]
<text>G1 </text>X<X> Z<Z> F<F per_minute>

[rapid]
<text>G0 </text>X<X> Z<Z>

[drill_cycle]
<text>DRILL Z</text><drill end Z> R<drill retract Z>[ Q<drill peck>][ P<drill dwell>] F<F> <drill mode>

[peck_dwell_drill_cycle]
<text>DRILL Z</text><drill end Z> R<drill retract Z>[ Q<drill peck>][ P<drill dwell>] F<F> <drill mode>
