# An invented post for the engine tests: cutter compensation with invented codes (Q40, Q41, Q42).
[post]
name = Fake compensation
format_version = 1

[settings]
decimals = 2
cutter_compensation = yes

[codes]
rapid = Q0
feed = Q1
ccw = Q2
cw = Q3
comp_left = Q41
comp_right = Q42
comp_off = Q40

[modal_groups]
motion = Q0 Q1 Q2 Q3

[rapid]
<code rapid> X<X> Z<Z>

[feed]
[<comp code> ]<code feed> X<X> Z<Z>

[arc_ccw]
<code ccw> X<X> Z<Z> I<I> K<K> R<R>

[arc_cw]
<code cw> X<X> Z<Z> I<I> K<K> R<R>
