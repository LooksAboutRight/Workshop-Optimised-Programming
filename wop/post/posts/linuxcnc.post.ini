# LinuxCNC post (lathe, G18 plane): G7/G8 diameter or radius mode, G95 feed per revolution, G96/G97, G76 thread cycle.
# Tried on one lathe (Schaublin 125, LinuxCNC 2.9.8). The user checks what a post writes, shipped posts too. Every post can crash a machine.
# Header: the work offset of the project (G54 ...) on its own line. Tool change: M9, M5, T.. M6, G43 H<tool offset>. G0 G1 G2 G3 and X Z
# are written only when they changed (modal); so are the coolant codes. The spindle codes (G96 / G97, M3) are written in full every time
# (the controller gave errors without them). Drilling: G81 / G82 / G83 / G73 in the G17 plane (the cycle axis is Z there), back to G18;
# tried as an air cut. I, J and K of G76 are diameter values in G7 mode (times 2, option `by_mode`; found on the machine).
# To be checked on the machine: the direction of G2 / G3 (our counter-clockwise is G2 in the G18 plane).

[post]
name = LinuxCNC
description = LinuxCNC lathe: G7/G8, G95, G96/G97, G76
format_version = 1

[settings]
# Cutter compensation: no writes the tool path (the contour moved by the nose radius, WOP's own compensation).
# yes writes the contour of a finishing pass with 'Cutter compensation' ticked, with G42 / G41 on the lead-in and G40 on
# the lead-out (tried on the machine, 2026-10-26).
cutter_compensation = yes
line_numbers = yes
x_diameters = yes
arcs_in_diameters = yes
threading_style = cycle
drilling_style = cycle
comment_replace = ( -> [, ) -> ]
file_extension = .ngc

[codes]
# The codes the templates use as <code name>. A fixed name with no code: the controller has no such function.
# work_offset_1, work_offset_2 ... are the work offsets the Setup form offers (the header writes the chosen one).
rapid = G0
feed = G1
machine_coordinates = G53
arc_ccw = G2
arc_cw = G3
dwell = G4
thread_cycle = G76
css = G96
rpm = G97
feed_per_rev = G95
units_mm = G21
units_inch = G20
absolute = G90
plane_zx = G18
plane_xy = G17
drill_cycle = G81
dwell_drill_cycle = G82
peck_drill_cycle = G83
chip_break_cycle = G73
cycle_cancel = G80
comp_left = G41
comp_right = G42
comp_off = G40
diameter_mode = G7
radius_mode = G8
tool_length_comp = G43
exact_path = G61
exact_stop = G61.1
path_blend = G64
work_offset_1 = G54
work_offset_2 = G55
work_offset_3 = G56
work_offset_4 = G57
work_offset_5 = G58
work_offset_6 = G59
work_offset_7 = G59.1
work_offset_8 = G59.2
work_offset_9 = G59.3
program_stop = M0
optional_stop = M1
program_end = M30
tool_change = M6
spindle_cw = M3
spindle_ccw = M4
spindle_stop = M5
coolant_mist = M7
coolant_flood = M8
coolant_off = M9

[modal_groups]
# Which codes cancel each other (LinuxCNC modal groups). Only the codes of the code table are listed. The names of the fixed
# groups cannot be changed; the codes can. A group with no code in the table has no line.
motion = G0 G1 G2 G3 G73 G76 G80 G81 G82 G83
plane = G17 G18
distance_mode = G90
feed_mode = G95
units = G20 G21
cutter_compensation = G40 G41 G42
tool_length_compensation = G43
coordinate_system = G54 G55 G56 G57 G58 G59 G59.1 G59.2 G59.3
path_control = G61 G61.1 G64
spindle_mode = G96 G97
diameter_mode = G7 G8
spindle = M3 M4 M5
coolant = M7 M8 M9
tool_change = M6
program_stop = M0 M1 M30
non_modal = G4 G53

[header]
(<project title safe>)
(postprocessor: <post name safe>)
<list notes>
(X values are <x values>, feed per revolution)

[note_entry]
(<note safe>)

[setup]
<code plane_zx> <units code> <code absolute> <code comp_off> <code feed_per_rev> <x mode code>
<work offset>

[footer]
<code program_end>

[comment]
(<comment text safe>)

[block_start]
(Block <block number>: <block type safe>[ <block name safe>])

[rapid]
<code rapid changed>[ X<X changed>][ Z<Z changed>]

[feed]
[<comp code> ]<code feed changed>[ X<X changed>][ Z<Z changed>][ F<F changed>]

[arc_ccw]
<code arc_ccw changed>[ X<X changed>][ Z<Z changed>] I<I> K<K>[ F<F changed>]

[arc_cw]
<code arc_cw changed>[ X<X changed>][ Z<Z changed>] I<I> K<K>[ F<F changed>]

[thread_cycle]
<code thread_cycle> P<pitch> Z<thread end Z> I<peak offset by_mode> J<first cut by_mode> K<thread depth by_mode> R<degression> Q<compound angle> H<spring passes>[ E<taper distance> L<taper code>]

[drill_cycle]
<code plane_xy>
<code drill_cycle> X0 Z<drill end Z> R<drill retract Z> F<F>
<code cycle_cancel>
<code plane_zx>

[dwell_drill_cycle]
<code plane_xy>
<code dwell_drill_cycle> X0 Z<drill end Z> R<drill retract Z> P<drill dwell> F<F>
<code cycle_cancel>
<code plane_zx>

[peck_drill_cycle]
<code plane_xy>
<code peck_drill_cycle> X0 Z<drill end Z> R<drill retract Z> Q<drill peck> F<F>
<code cycle_cancel>
<code plane_zx>

[chip_break_cycle]
<code plane_xy>
<code chip_break_cycle> X0 Z<drill end Z> R<drill retract Z> Q<drill peck> F<F>
<code cycle_cancel>
<code plane_zx>

[dwell]
<code dwell> P<dwell>

[program_stop]
<code program_stop>

[optional_stop]
<code optional_stop>

[machine_rapid]
<code machine_coordinates> <code rapid> X<X> Z<Z>

[tool_change]
<code coolant_off>
<code spindle_stop>
T<tool number> <code tool_change>
<code tool_length_comp> H<tool offset>

[spindle_css]
<code css>[ D<S max>] S<S> <spindle code>

[spindle_rpm]
<code rpm> S<S> <spindle code>

[spindle_stop]
<code spindle_stop>

[coolant_flood]
<code coolant_flood changed>

[coolant_mist]
<code coolant_mist changed>

[coolant_off]
<code coolant_off changed>
