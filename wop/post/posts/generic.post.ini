# Generic post: plain G-code that as many controllers as possible understand (Grbl, simple LinuxCNC set-ups ...).
# Only G0, G1, G2, G3, G4, M0, M1, M3, M5, M7, M8, M9 and M30, with the feed in mm/min (G94: simple controllers have no
# feed per revolution, so the feed of every move is worked out from the spindle speed). No diameter mode, no constant
# surface speed (the generator offers a fixed RPM), no canned cycles: a drill is written as plain moves and a thread as
# plain passes. A tool change is a comment and a stop (M0): the operator changes the tool and starts again.
# A thread written as plain passes only follows its groove on a controller that keeps the passes in step with the
# spindle; the output says so in a comment before every thread.
# This is the default post (part of the program, not in the list of posts; a copy to import is `examples/posts/plain_gcode.post.ini`): a post that lacks a section takes it from here. NOTHING here was run on a machine: the user
# checks what a post writes, shipped posts too. Every post can crash a machine.

[post]
name = Generic (plain G-code)
description = plain G-code, feed per minute, no cycles
format_version = 1

[settings]
threading_style = passes
drilling_style = expanded
comment_replace = ( -> [, ) -> ]
file_extension = .ngc

[codes]
# The codes the templates use as <code name>. A fixed name with no code: the controller has no such function.
rapid = G0
feed = G1
arc_ccw = G2
arc_cw = G3
dwell = G4
units_mm = G21
absolute = G90
feed_per_minute = G94
plane_zx = G18
program_stop = M0
optional_stop = M1
program_end = M30
spindle_cw = M3
spindle_ccw = M4
spindle_stop = M5
coolant_mist = M7
coolant_flood = M8
coolant_off = M9

[modal_groups]
# Which codes cancel each other (the usual ISO groups). The names of the fixed groups cannot be changed; the codes can.
motion = G0 G1 G2 G3
plane = G17 G18 G19
distance_mode = G90 G91
feed_mode = G93 G94 G95
units = G20 G21
cutter_compensation = G40 G41 G42
spindle_mode = G96 G97
spindle = M3 M4 M5
coolant = M7 M8 M9
program_stop = M0 M1 M2 M30
non_modal = G4

[header]
(<project title safe>)
(postprocessor: <post name safe>)
<list notes>

[note_entry]
(<note safe>)

[setup]
<code units_mm> <code absolute> <code feed_per_minute> <code plane_zx>

[footer]
<code program_end>

[comment]
(<comment text safe>)

[block_start]
(Block <block number>: <block type safe>[ <block name safe>])

[rapid]
<code rapid> [X<X>] [Z<Z>]

[feed]
<code feed> X<X> Z<Z>[ F<F per_minute changed>]

[arc_ccw]
<code arc_ccw> X<X> Z<Z> I<I> K<K>[ F<F per_minute changed>]

[arc_cw]
<code arc_cw> X<X> Z<Z> I<I> K<K>[ F<F per_minute changed>]

[thread_passes]
(thread as plain passes: it only follows its groove if the controller keeps every pass in step with the spindle)

[dwell]
<code dwell> P<dwell>

[program_stop]
<code program_stop>

[optional_stop]
<code optional_stop>

[tool_change]
(change to tool <tool number>, then start the program again)
<code program_stop>

[spindle_rpm]
<spindle code> S<S>

[spindle_stop]
<code spindle_stop>

[coolant_flood]
<code coolant_flood>

[coolant_mist]
<code coolant_mist>

[coolant_off]
<code coolant_off>
