# EXAMPLE post: the LinuxCNC post with a custom machine function (a bar feeder), to show the syntax of custom codes, custom modal groups
# and custom concepts. Import it in File > Postprocessors (Import...). What is new compared to the LinuxCNC post:
#   [codes]            three codes of the bar feeder at the end (M100 to M102 are the user M codes of LinuxCNC)
#   [modal_groups]     a group of your own, "barfeeder", for the three codes
#   [functions]        one custom concept, bar_feed, that opens the feeder, moves the bar and clamps it again
#   [bar_feed_variables]  what the concept needs: the distance (a float with limits), and whether to pull the bar back first (a bool)
#   [bar_feed]         the template: it uses the three codes and the two variables
# A custom concept is written like any other concept (see the pages of the editor). Choose it in a Machine function block
# (the function list follows the post). NOTHING here was run on a machine; every post can crash a machine.

[post]
name = LinuxCNC with a custom machine function (example)
description = the LinuxCNC post plus a custom machine function for a bar feeder
format_version = 1

[settings]
# Cutter compensation: no writes the tool path (the contour moved by the nose radius, WOP's own compensation).
# yes writes the contour of a finishing pass with 'Cutter compensation' ticked, with G42 / G41 on the lead-in and G40 on
# the lead-out (tried on the machine, 2026-10-26).
cutter_compensation = yes
line_numbers = yes
x_diameters = yes
arcs_in_diameters = yes
threading_style = cycle
drilling_style = cycle
comment_replace = ( -> [, ) -> ]
file_extension = .ngc

[codes]
# The codes the templates use as <code name>. A fixed name with no code: the controller has no such function.
# work_offset_1, work_offset_2 ... are the work offsets the Setup form offers (the header writes the chosen one).
rapid = G0
feed = G1
machine_coordinates = G53
arc_ccw = G2
arc_cw = G3
dwell = G4
thread_cycle = G76
css = G96
rpm = G97
feed_per_rev = G95
units_mm = G21
units_inch = G20
absolute = G90
plane_zx = G18
plane_xy = G17
drill_cycle = G81
dwell_drill_cycle = G82
peck_drill_cycle = G83
chip_break_cycle = G73
cycle_cancel = G80
comp_left = G41
comp_right = G42
comp_off = G40
diameter_mode = G7
radius_mode = G8
tool_length_comp = G43
exact_path = G61
exact_stop = G61.1
path_blend = G64
work_offset_1 = G54
work_offset_2 = G55
work_offset_3 = G56
work_offset_4 = G57
work_offset_5 = G58
work_offset_6 = G59
work_offset_7 = G59.1
work_offset_8 = G59.2
work_offset_9 = G59.3
program_stop = M0
optional_stop = M1
program_end = M30
tool_change = M6
spindle_cw = M3
spindle_ccw = M4
spindle_stop = M5
coolant_mist = M7
coolant_flood = M8
coolant_off = M9
# the codes of the bar feeder: a name of your own and the code of your controller
barfeeder_open = M100
barfeeder_move = M101
barfeeder_clamp = M102

[modal_groups]
# Which codes cancel each other (LinuxCNC modal groups). Only the codes of the code table are listed. The names of the fixed
# groups cannot be changed; the codes can. A group with no code in the table has no line.
motion = G0 G1 G2 G3 G73 G76 G80 G81 G82 G83
plane = G17 G18
distance_mode = G90
feed_mode = G95
units = G20 G21
cutter_compensation = G40 G41 G42
tool_length_compensation = G43
coordinate_system = G54 G55 G56 G57 G58 G59 G59.1 G59.2 G59.3
path_control = G61 G61.1 G64
spindle_mode = G96 G97
diameter_mode = G7 G8
spindle = M3 M4 M5
coolant = M7 M8 M9
tool_change = M6
program_stop = M0 M1 M30
non_modal = G4 G53
# a group of your own: its codes cancel each other, so two of them cannot stand in one line
barfeeder = M100 M101 M102

