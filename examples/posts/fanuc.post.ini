# REFERENCE post, not shipped with the program: import it in File > Postprocessors... (Import). Built from the manuals and never run on a real
# controller; use it as a working version to change, or as a blind reference for a new post.
#
# Fanuc-style post (0i-T class, G-code system A). NOTHING here is verified on a real controller: the user checks what a
# post writes. Every post can crash a machine.
#
# What differs from LinuxCNC: X is always a diameter (a Fanuc lathe has no radius mode in the program: the parameter
# decides), every number has a decimal point (X10 would mean 10 micrometres), the feed per revolution is G99, the tool
# change is T0101 (tool number and offset number the same), constant surface speed is `G50 S<limit>` and `G96 S<speed>`,
# a thread is the two-block G76 (P Q R, then X Z P Q F), a dwell is `G4 X<seconds>`, the program starts with % and an
# O number and ends with M30 and %. The arc words I and K stay radius values; the direction of G2 and G3 is taken over
# from the LinuxCNC post and has to be checked on the machine, like the sign of the thread values.
#
# Guesses: program number 1000, smallest G76 cut 100 micrometres (Q of the first block), no finishing allowance in G76
# (R0.), offset number = tool number, G76 angle = the compound angle rounded.

[post]
name = Fanuc (0i-T style)
description = Fanuc lathe: diameters, decimal points, G99, T0101, two-block G76
format_version = 1

[settings]
# Cutter compensation: off writes the tool path (the contour moved by the nose radius, WOP's own compensation).
# yes writes the contour of a finishing pass with 'Cutter compensation' ticked, with G42 / G41 on the lead-in and G40 on
# the lead-out. NOT tried on a machine: which reference point the control expects (tool tip or centre of the nose circle) is open.
cutter_compensation = no
x_diameters = yes
arcs_in_diameters = yes
threading_style = two_block
drilling_style = expanded
point = yes
program_number = 1000
comment_upper = yes
comment_allowed = ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,+-/:=
file_extension = .nc

[codes]
# The codes the templates use as <code name>. A fixed name with no code: the controller has no such function.
rapid = G0
feed = G1
arc_ccw = G2
arc_cw = G3
dwell = G4
thread_cycle = G76
css = G96
rpm = G97
spindle_limit = G50
feed_per_rev = G99
units_mm = G21
plane_zx = G18
comp_left = G41
comp_right = G42
comp_off = G40
program_stop = M0
optional_stop = M1
program_end = M30
spindle_cw = M3
spindle_ccw = M4
spindle_stop = M5
coolant_mist = M7
coolant_flood = M8
coolant_off = M9

[modal_groups]
# Which codes cancel each other (Fanuc 0i-T style, to check against the manual of the controller). The names of the fixed groups cannot be changed; the codes can.
motion = G0 G1 G2 G3 G32 G34 G70 G71 G72 G73 G74 G75 G76 G90 G92 G94
plane = G17 G18 G19
feed_mode = G98 G99
units = G20 G21
cutter_compensation = G40 G41 G42
coordinate_system = G54 G55 G56 G57 G58 G59
spindle_mode = G96 G97
spindle = M3 M4 M5
coolant = M7 M8 M9
program_stop = M0 M1 M2 M30
non_modal = G4 G10 G28 G30 G50

[header]
%
O<program number> (<project title safe>)
(POSTPROCESSOR: <post name safe>)
<list notes>
(X ARE DIAMETERS, FEED PER REVOLUTION)

[note_entry]
(<note safe>)

[setup]
<code units_mm> <code comp_off> <code feed_per_rev> <code plane_zx>

[footer]
<code program_end>
%

[comment]
(<comment text safe>)

[block_start]
(BLOCK <block number>: <block type safe>[ <block name safe>])

[rapid]
<code rapid> [X<X diameter>] [Z<Z>]

[feed]
[<comp code> ]<code feed> X<X diameter> Z<Z>[ F<F changed>]

[arc_ccw]
<code arc_ccw> X<X diameter> Z<Z> I<I> K<K>[ F<F changed>]

[arc_cw]
<code arc_cw> X<X diameter> Z<Z> I<I> K<K>[ F<F changed>]

[thread_two_block]
<code thread_cycle> P<spring passes width=2>00<compound angle decimals=0 width=2> Q100 R0.
<code thread_cycle> X<thread root X diameter> Z<thread end Z> P<thread depth scale=1000 decimals=0> Q<first cut scale=1000 decimals=0> F<pitch>

[dwell]
<code dwell> X<dwell>

[program_stop]
<code program_stop>

[optional_stop]
<code optional_stop>

[tool_change]
T<tool number width=2><tool offset width=2>

# The move to the tool change position: without a [change_position] the post writes a plain rapid move to the position of the tool change
# (work coordinates), or, when the machine has a tool change position, one in machine coordinates. A Fanuc lathe often goes to its
# reference point with G28 instead (U0 W0: no intermediate point). To use it remove the # of the next two lines.
#[change_position]
#G28 U0 W0

[spindle_css]
[<code spindle_limit> S<S max decimals=0>]
<code css> S<S> <spindle code>

[spindle_rpm]
<code rpm> S<S decimals=0> <spindle code>

[spindle_stop]
<code spindle_stop>

[coolant_flood]
<code coolant_flood>

[coolant_mist]
<code coolant_mist>

[coolant_off]
<code coolant_off>
